name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm at the version package.json pins (packageManager).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Also generates the Prisma client (postinstall).
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test

      # No database needed: nothing connects until a request runs.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
