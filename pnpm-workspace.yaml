allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  # Browser-only: the ONNX runtime we use is onnxruntime-web, loaded by
  # lib/llm/wasm-embedder.ts. Skip building the native Node addon.
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
# Minimum versions for packages that come in through other dependencies.
overrides:
  mysql2: ">=3.23.1"
  deepmerge-ts: ">=8.0.0"
  source-map-js: ">=1.2.2"
  # One KaTeX for the stylesheet (ours) and the renderer (rehype-katex asks
  # for 0.16): the two must match, or sub- and superscripts lose their size.
  katex: "$katex"
